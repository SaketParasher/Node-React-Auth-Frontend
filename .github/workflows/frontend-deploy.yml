name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub runner par repository code download karega
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js install karega
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. package-lock.json ke exact dependencies install hongi
      - name: Install dependencies
        run: npm ci

      # 4. ESLint run hoga
      - name: Run ESLint
        run: npm run lint

      # 5. Unit/component tests run honge
      - name: Run tests
        run: npm run test:run

      # 6. Vite production build create karega
      - name: Build frontend
        run: npm run build

      # 7. GitHub Secrets se AWS credentials configure hongi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 8. dist folder ke files S3 bucket me upload hongi
      - name: Deploy to S3
        run: |
          aws s3 sync dist/ \
            s3://react-role-based-auth-routing-866865534335-ap-southeast-2-an \
            --delete

      # 9. CloudFront ka old cache invalidate hoga
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1MQBKVFHGW0WB \
            --paths "/*"